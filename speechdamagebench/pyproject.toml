[project]
name = "speechdamagebench"
version = "0.1.0"
description = "Deterministic, seed-controlled speech damage generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
]

[project.scripts]
speechdamagebench = "speechdamagebench.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["speechdamagebench*"]
